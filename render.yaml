services:
  - type: web
    name: danzason-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: EXTERNAL_CRM_API_KEY
        value: 2ee062fd20e15a2da9c359fac339da2c24396001c9d748df0ef4c6a1d6a776a6
      - key: MONGODB_URI
        sync: false
